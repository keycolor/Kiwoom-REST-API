name: Deploy Trading Bot to GCP VM

on:
  push:
    branches:
      - main  # main 브랜치에 코드가 push되면 배포 자동 시작

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    # 1. GitHub 저장소 코드 체크아웃
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. 서비스 계정 키를 사용한 GCP 인증
    - name: Google Cloud Auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    # 3. gcloud CLI 환경 도구 설정
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # 4. SSH-over-IAP 터널링을 이용한 무방화벽(Keyless-like) 원격 배포 및 서비스 재시작
    - name: Secure SSH Deploy & Restart Daemon
      run: |
        gcloud compute ssh ${{ secrets.GCP_VM_NAME }} \
          --zone=${{ secrets.GCP_VM_ZONE }} \
          --project=${{ secrets.GCP_PROJECT_ID }} \
          --tunnel-through-iap \
          --quiet \
          --command="
            cd ~/kiwoom-bot &&
            git pull origin main &&
            uv sync &&
            sudo systemctl restart kiwoom.service
          "
